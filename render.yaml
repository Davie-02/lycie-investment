# No `databases:` block on purpose: the database is Neon (free, never expires).
# Render's own free Postgres is deleted after 30 days.

services:
  - type: web
    name: lycie-investment-api
    runtime: node
    plan: free
    rootDir: server
    # Render waits for this to answer before switching traffic to a new deploy.
    healthCheckPath: /api/health
    # --include=dev: NODE_ENV=production (set below) makes plain `npm install` skip
    # devDependencies, but the Nest CLI, TypeScript and Prisma CLI needed to build
    # and migrate live there.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # migrate deploy applies committed migrations without prompting (safe for
    # CI/CD, unlike `migrate dev`); seed is intentionally NOT run automatically
    # here — run it manually once after the first deploy if you want the
    # sample data, or skip it entirely once real inventory is entered via /admin.
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false # your Neon connection string (must end with ?sslmode=require)
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # set this to your deployed frontend URL after it exists
      # Requests now pass through TWO proxies before reaching the app: Vercel (which
      # forwards /api on the website's domain) and Render's own. The app must skip both
      # to see each visitor's real address; with 1 it would see Vercel's servers instead
      # and the per-visitor rate limits (login, forms, Lycie chat) would throttle
      # everyone together. If you turn off the same-domain setup (VITE_DIRECT_API=true
      # on Vercel), set this back to 1.
      - key: TRUST_PROXY
        value: 2
      # Free key from https://aistudio.google.com/apikey — leave blank and the
      # Lycie chat widget simply hides itself.
      - key: GEMINI_API_KEY
        sync: false
      # Optional mailbox check at sign-up: kickbox, zerobounce or abstract (+ its API key).
      # Leave blank and the free DNS/typo/throwaway checks still run.
      - key: EMAIL_VERIFICATION_PROVIDER
        sync: false
      - key: EMAIL_VERIFICATION_API_KEY
        sync: false
      # System administrator (Owner) protection. Two-step sign-in is required unless set to "false".
      # Optionally limit administrators to your office/home addresses: "41.70.1.2, 102.68.3.4".
      - key: SYSTEM_ADMIN_ALLOWED_IPS
        sync: false
      # Mobile money (Airtel Money / TNM Mpamba) through PayChangu — optional.
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      # WhatsApp notifications (Meta Cloud API) — optional; needs an approved one-variable template.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      # Social media desk (optional — the tools stay hidden until these are set).
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_INSTAGRAM_ID
        sync: false
      - key: SITE_URL
        sync: false # the website's public address, e.g. https://lycie-investments.vercel.app
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Optional sign-in tuning. Defaults: 2h normal / 30d "keep me signed in".
      - key: REMEMBER_ME_EXPIRES_IN
        value: 30d
      # "Continue with Google / Facebook" — buttons appear only once these are set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      # Dashboard-managed: "auto" for Cloudflare R2, or your bucket's region
      # (e.g. us-west-004) for Backblaze B2.
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_PUBLIC_URL_BASE
        sync: false # leave blank when using a private bucket
      # Set to "true" in the Render dashboard = files stored in a PRIVATE bucket
      # and served through the API (/api/media/...), so a free private bucket
      # (e.g. Backblaze B2, no card) works. Deliberately sync:false — a fixed
      # value here would be re-applied on every deploy and undo the dashboard.
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        sync: false # resend or brevo (optional — inferred from whichever key is set)
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
