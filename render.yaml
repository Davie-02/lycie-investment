databases:
  - name: lycie-investment-db
    databaseName: lycie_investment
    plan: free

services:
  - type: web
    name: lycie-investment-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    # migrate deploy applies committed migrations without prompting (safe for
    # CI/CD, unlike `migrate dev`); seed is intentionally NOT run automatically
    # here — run it manually once after the first deploy if you want the
    # sample data, or skip it entirely once real inventory is entered via /admin.
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lycie-investment-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false # set this to your deployed frontend URL after it exists
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_PUBLIC_URL_BASE
        sync: false
