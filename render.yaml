databases:
  - name: lycie-investment-db
    databaseName: lycie_investment
    plan: free
  # Strapi's own database — deliberately separate from the main app's DB.
  # Strapi owns marketing content (testimonials, FAQ, blog posts, SEO
  # settings) only; everything transactional (vehicles, bookings, customers,
  # payments) stays in lycie-investment-db.
  - name: lycie-strapi-db
    databaseName: lycie_strapi
    plan: free

services:
  - type: web
    name: lycie-investment-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    # migrate deploy applies committed migrations without prompting (safe for
    # CI/CD, unlike `migrate dev`); seed is intentionally NOT run automatically
    # here — run it manually once after the first deploy if you want the
    # sample data, or skip it entirely once real inventory is entered via /admin.
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lycie-investment-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # set this to your deployed frontend URL after it exists
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_PUBLIC_URL_BASE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: STRAPI_URL
        sync: false # e.g. https://lycie-strapi-cms.onrender.com — set once the Strapi service below exists
      - key: STRAPI_API_TOKEN
        sync: false # generate a "Read-only" API token in Strapi admin (Settings > API Tokens) after first deploy

  - type: web
    name: lycie-strapi-cms
    runtime: node
    plan: free
    rootDir: strapi
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lycie-strapi-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 1337
      - key: NODE_ENV
        value: production
      - key: STRAPI_URL
        sync: false # this service's own public URL, e.g. https://lycie-strapi-cms.onrender.com
      - key: APP_KEYS
        generateValue: true
      - key: ADMIN_AUTH_SECRET
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ADMIN_ENCRYPTION_KEY
        generateValue: true
