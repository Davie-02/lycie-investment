<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lycie Investments — Vehicle Import, Sales, Hire & Clearing</title>
    <meta
      name="description"
      content="Lycie Investments sources, imports, sells, hires and clears vehicles for customers in Malawi. Browse vehicles, request an import, or arrange clearing."
    />
    <meta property="og:title" content="Lycie Investments" />
    <meta
      property="og:description"
      content="Vehicle sourcing, importing, dealership, hire and clearing services."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#19406c" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Paints the chosen theme before the page loads, so it never flashes the wrong colours.
         Same rules as src/utils/theme.ts (admin default, visitor's light/dark choice, device setting). -->
    <script>
      try {
        if (location.pathname.indexOf("/admin") !== 0) {
          var cfg = JSON.parse(localStorage.getItem("lycie_site_theme_cfg") || "{}");
          var names = ["classic", "ocean", "warm", "dark"];
          var base = names.indexOf(cfg.defaultTheme) > -1 ? cfg.defaultTheme : "classic";
          var choice = localStorage.getItem("lycie_theme_choice");
          var theme = base;
          if (cfg.allowVisitorSwitch !== false) {
            if (choice === "dark") theme = "dark";
            else if (choice === "light") theme = base === "dark" ? "classic" : base;
            else if (cfg.followDeviceDarkMode && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
          }
          if (theme !== "classic") document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
